<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- O card escondido que atua como modal -->
<dialog id="meuModal">
  <div class="modal-conteudo">
    <h2>Card em Destaque</h2>
    <p>Este card ocupa quase toda a tela, centralizado.</p>
    <!-- Botão para fechar o modal -->
    <button onclick="document.getElementById('meuModal').close()">Fechar</button>
  </div>
</dialog>

<!-- Grade dos seus cards na tela principal -->
<div class="cards-container">
  <div class="card" onclick="document.getElementById('meuModal').showModal()">
    <h3>Card 1</h3>
    <p>Clique para abrir</p>
  </div>
  
  <div class="card" onclick="document.getElementById('meuModal').showModal()">
    <h3>Card 2</h3>
    <p>Clique para abrir</p>
  </div>
</div>

</body>
</html>
